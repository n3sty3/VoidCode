name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VoidCode.slnx

      - name: Build
        run: dotnet build VoidCode.slnx -c Release --no-restore

      - name: Test
        run: dotnet test VoidCode.slnx -c Release --no-build

      # JS syntax is covered by ESLint (ui job) and by the Playwright boot assertions.

  build-test-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Core, macOS host & Tests
        run: |
          dotnet build VoidCode.Core/VoidCode.Core.csproj -c Release
          dotnet build VoidCode.Mac/VoidCode.Mac.csproj -c Release
          dotnet build tests/VoidCode.Tests/VoidCode.Tests.csproj -c Release

      - name: Test (.NET Core suite on macOS)
        run: dotnet test tests/VoidCode.Tests/VoidCode.Tests.csproj -c Release --no-build

  # UI tests need no Windows: run them on Linux with Playwright Chromium. Baselines
  # are platform-specific, so playwright.config.js only enforces screenshots where a
  # baseline for the running platform is committed (none for linux yet -> skipped).
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node unit tests
        run: npm run test:unit

      # Blocking now that lint debt is cleared (0 errors, 0 warnings).
      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings=0

      # tsc --checkJs over wwwroot/core + wwwroot/modules. The count is 0 and is
      # ratcheted by the metrics step below, so this can be blocking.
      - name: Typecheck (tsc --checkJs)
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Metrics ratchet
        run: node scripts/metrics.js --check

      # the host and the page must agree on payload key names. Two shipping bugs came
      # from a payload serializing PascalCase keys while the page read camelCase - the mock host in the
      # UI harness speaks camelCase, so only a static comparison catches it.
      - name: Payload key audit
        run: npm run audit:payloads

      - name: UI tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
