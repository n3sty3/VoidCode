name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Package win-x64 release
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1 -Runtime win-x64

      - name: Package win-arm64 release
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1 -Runtime win-arm64 -SkipUiChecks

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidcode-windows-releases
          path: |
            dist/VoidCode-Setup-*.exe
            dist/VoidCode-Setup-*.exe.sha256
            dist/VoidCode-win-x64.zip
            dist/VoidCode-win-x64.zip.sha256
            dist/VoidCode-win-arm64.zip
            dist/VoidCode-win-arm64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoidCode-Setup-*.exe
            dist/VoidCode-Setup-*.exe.sha256
            dist/VoidCode-win-x64.zip
            dist/VoidCode-win-x64.zip.sha256
            dist/VoidCode-win-arm64.zip
            dist/VoidCode-win-arm64.zip.sha256
          generate_release_notes: true

  release-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Core Tests on macOS
        run: dotnet test tests/VoidCode.Tests/VoidCode.Tests.csproj -c Release

      - name: Package macOS Apple Silicon (osx-arm64) & Intel (osx-x64)
        run: |
          chmod +x ./scripts/package-mac.sh
          ./scripts/package-mac.sh osx-arm64
          ./scripts/package-mac.sh osx-x64

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidcode-macos-releases
          path: |
            dist/VoidCode-*-osx-*.dmg
            dist/VoidCode-*-osx-*.dmg.sha256
            dist/VoidCode-osx-*.zip
            dist/VoidCode-osx-*.zip.sha256

      - name: Publish macOS Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoidCode-*-osx-*.dmg
            dist/VoidCode-*-osx-*.dmg.sha256
            dist/VoidCode-osx-*.zip
            dist/VoidCode-osx-*.zip.sha256
          generate_release_notes: true

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Package Linux (linux-x64)
        run: |
          chmod +x ./scripts/package-linux.sh
          ./scripts/package-linux.sh linux-x64

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidcode-linux-releases
          path: |
            dist/VoidCode-linux-*.tar.gz
            dist/VoidCode-linux-*.tar.gz.sha256

      - name: Publish Linux Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoidCode-linux-*.tar.gz
            dist/VoidCode-linux-*.tar.gz.sha256
          generate_release_notes: true
